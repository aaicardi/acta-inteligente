services:
  - type: web
    name: acta-inteligente-backend
    runtime: node
    rootDir: snap-backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # --- Sesiones ---
      # Render lo genera solo la primera vez y lo mantiene entre despliegues.
      # Cambiarlo invalida todas las sesiones activas.
      - key: JWT_SECRET
        generateValue: true

      # --- Recuperacion de analisis huerfanos al arrancar ---
      # Minutos de antiguedad tras los cuales un item en 'analizando' se
      # considera huerfano (el proceso se reinicio a mitad del analisis) y se
      # marca 'revisar'. Ver src/services/recuperacionAnalisis.js. Opcional:
      # sin esta variable, el backend usa 5 minutos por defecto.
      - key: UMBRAL_ANALISIS_HUERFANO_MIN
        value: "5"

      # --- OpenAI (vision) ---
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-luna

      # --- Proveedor de IA para vision: openai (por defecto) o deepseek ---
      - key: VISION_PROVIDER
        value: openai
      # Solo si VISION_PROVIDER=deepseek. deepseek no esta validado en
      # produccion (su modelo de vision es experimental).
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_VISION_MODEL
        value: deepseek-v4-flash-vision-exp
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com

      # --- MySQL gestionado (Aiven) ---
      # Host/puerto/usuario/base no son secretos; la contrasena si.
      - key: DB_HOST
        value: mysql-23f32eeb-acta-inteligente.e.aivencloud.com
      - key: DB_PORT
        value: "18599"
      - key: DB_USER
        value: avnadmin
      - key: DB_NAME
        value: defaultdb
      - key: DB_PASSWORD
        sync: false
      # Aiven exige TLS y firma con su propia CA. Render no permite subir
      # archivos, asi que el certificado viaja en una variable: se pega en
      # base64 y en una sola linea (base64 -w0 certs/aiven-ca.pem), porque un
      # bloque PEM multilinea se puede truncar al pegarlo en el panel.
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA_B64
        sync: false

      # --- Cloudinary (fotos de items) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # --- CORS ---
      # Dominio del frontend en Vercel. Separar por comas si hay varios
      # (produccion y previews).
      - key: CORS_ORIGINS
        sync: false
